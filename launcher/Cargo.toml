[package]
name = "launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4.3"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
softbuffer = "0.4.8"
toml = "1.2.1"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation", "Win32_Media_Audio", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation", "Win32_NetworkManagement_Dns", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Dwm"] }
winit = "0.30.13"

[dev-dependencies]
tempfile = "3.27.0"
